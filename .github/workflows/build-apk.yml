name: Build Cukoon APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Align native module versions with Expo SDK
        run: npx expo install --fix

      - name: Prebuild native Android project
        run: npx expo prebuild -p android --no-install

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build release APK (JS bundle packaged inside, no Metro needed)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cukoon-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
