name: Build Cukoon APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install

      - name: Prebuild native Android project
        run: npx expo prebuild -p android --no-install

      - name: Increase Gradle download timeout
        run: sed -i '/^networkTimeout=/d; $a networkTimeout=60000' android/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -PbundleInDebug=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cukoon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
